# Arcwright workshop — CI gates (scaffolded by the ci-gates skill, trimmed to this repo).
# Monorepo: root build pipeline + website (Vite/React/TS) + npm packages.
#
# Runner trust boundary:
# - pull_request events run on isolated GitHub-hosted ubuntu-latest runners.
# - push events for main/dev run on the trusted org runner labeled `unn`
#   ([self-hosted, linux, x64, unn]) for the existing Docker-based checks.
# Keeping the selection event-aware prevents untrusted PR code from reaching
# the Docker-backed self-hosted hosts.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required by the pr-title semantic check (amannn/action-semantic-pull-request)
  # to read the pull request; without it the job 403s "Resource not accessible".
  pull-requests: read

# All deps are public npm. Trusted org runners carry a user-level ~/.npmrc
# pointed at a private AWS CodeArtifact mirror with a frequently-expired token,
# which 401s every npm install. Force the public registry and ignore that
# userconfig on every npm step via these env vars.
env:
  npm_config_registry: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /dev/null

jobs:
  # Build verification — runs the workshop packager (includes the no-leak check).
  build-package:
    name: build (package)
    runs-on: ${{ github.event_name == 'push' && 'unn' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build/build.js

  # Unit tests + coverage gate (agent-orchestration package, Vitest 80/80/70).
  test-package:
    name: test (package)
    runs-on: ${{ github.event_name == 'push' && 'unn' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/agent-orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm cache: this package's package-lock.json is gitignored by repo
          # convention (.gitignore: packages/*/package-lock.json), so it isn't in
          # the CI checkout. Use `npm install` (not `npm ci`) for the same reason.
      - run: npm install --no-audit --no-fund
      - run: npm run test:coverage

  # Website static gates: lint + type-check + production build.
  website:
    name: static (website)
    runs-on: ${{ github.event_name == 'push' && 'unn' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Catches src/data/ drifting from the repo it describes (dead skill slugs,
      # unmapped agent icons). Not in `npm run build`: the Dockerfile builds with
      # website/ as its context, where ../.agents/skills does not exist.
      - run: npm run check:data
      - run: npm run build # tsc -b && vite build (type-check + bundle)

  # Security: secret scan, dependency/vuln, SAST - language-agnostic.
  # Pull requests run this job on an isolated GitHub-hosted runner, so no
  # self-hosted Docker socket or persistent runner host is exposed to PR code.
  # Scanners run as native binaries against $GITHUB_WORKSPACE.
  security:
    name: security
    runs-on: ${{ github.event_name == 'push' && 'unn' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write # allow SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # gitleaks CLI (MIT, free). The gitleaks-action wrapper requires a paid
        # GITLEAKS_LICENSE on private repos; the binary does not. fetch-depth:0
        # gives it full history. .gitleaks.toml allowlists doc false-positives.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source="$GITHUB_WORKSPACE" \
            --config="$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact --no-banner --exit-code=1 -v
      - name: Dependency + vuln scan (trivy)
        # trivy CLI (Apache-2.0). Run the binary natively so the scanner always
        # reads the checked-out workspace directly on either runner type.
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz \
            | tar -xz -C /tmp trivy
          /tmp/trivy fs --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress "$GITHUB_WORKSPACE"
      - name: Dependency vulnerabilities (OSV-Scanner / OSV.dev)
        # Scans every committed lockfile against OSV.dev; fails on findings.
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner && chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --recursive "$GITHUB_WORKSPACE"

  # SAST (semgrep) - HARD gate. The semgrep image ships `semgrep-core`, which
  # is more reliable here than installing the native binary. Copy the checked
  # out tree into the container so this works consistently on both the isolated
  # PR runner and the trusted push runner without relying on host-path mounts.
  sast:
    name: sast (semgrep)
    runs-on: ${{ github.event_name == 'push' && 'unn' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: SAST (semgrep)
        # Gate on ERROR severity only (WARNING/INFO are noise on a skills+tooling
        # monorepo). Three rules are excluded as false-positives here:
        #   - detect-child-process: hook scripts/installers spawn processes by
        #     design (CLI tooling, not request handlers).
        #   - detect-insecure-websocket: only a `ws://` example in security docs.
        #   - dockerfile missing-user: the nginx static image binds :80 as root.
        # All rules still run, so new high-severity issues (eval, hardcoded
        # secrets, injection) fail the gate.
        run: |
          set -euo pipefail
          CID=$(docker create semgrep/semgrep:1.168.0 \
            semgrep scan --config auto --severity ERROR --error \
              --exclude-rule javascript.lang.security.detect-child-process.detect-child-process \
              --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
              --exclude-rule dockerfile.security.missing-user.missing-user \
              /src)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$GITHUB_WORKSPACE/." "$CID:/src"
          docker start -a "$CID"

  # Merge-gate hygiene: Conventional PR title (mirrors the local commit advisory).
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
