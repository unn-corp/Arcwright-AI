# Arcwright workshop — CI gates (scaffolded by the ci-gates skill, trimmed to this repo).
# Monorepo: root build pipeline + website (Vite/React/TS) + npm packages.
#
# Runners: self-hosted only (no GitHub-hosted fallback). All jobs target the
# unn-corp org runners on the mothership VPS via labels [self-hosted, linux, x64,
# unn] (myoung34/github-runner, ubuntu-jammy, RUNNER_SCOPE=org, RUNNER_GROUP=
# default). If a job queues forever: confirm the org runner group `default`
# grants this repo access and that ci-runner-runner-{1,2,3} are online on the VPS.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All deps are public npm. The self-hosted runners carry a user-level ~/.npmrc
# pointed at a private AWS CodeArtifact mirror with a frequently-expired token,
# which 401s every npm install. Force the public registry and ignore that
# userconfig on every npm step via these env vars.
env:
  npm_config_registry: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /dev/null

jobs:
  # Build verification — runs the workshop packager (includes the no-leak check).
  build-package:
    name: build (package)
    runs-on: [self-hosted, linux, x64, unn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build/build.js

  # Unit tests + coverage gate (agent-orchestration package, Vitest 80/80/70).
  test-package:
    name: test (package)
    runs-on: [self-hosted, linux, x64, unn]
    defaults:
      run:
        working-directory: packages/agent-orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm cache: this package's package-lock.json is gitignored by repo
          # convention (.gitignore: packages/*/package-lock.json), so it isn't in
          # the CI checkout. Use `npm install` (not `npm ci`) for the same reason.
      - run: npm install --no-audit --no-fund
      - run: npm run test:coverage

  # Website static gates: lint + type-check + production build.
  website:
    name: static (website)
    runs-on: [self-hosted, linux, x64, unn]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # tsc -b && vite build (type-check + bundle)

  # Security: secret scan, dependency/vuln, SAST — language-agnostic.
  # gitleaks-action is free on public repos; a private repo needs GITLEAKS_LICENSE.
  security:
    name: security
    runs-on: [self-hosted, linux, x64, unn]
    permissions:
      contents: read
      security-events: write # allow SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # Run the gitleaks binary directly (Apache-2.0, free). The gitleaks-action
        # wrapper requires a paid GITLEAKS_LICENSE on private repos; the CLI does
        # not. fetch-depth:0 above gives it full history to scan.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo --config=/repo/.gitleaks.toml \
            --redact --no-banner --exit-code=1 -v
      - name: Dependency + vuln scan (trivy)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Dependency vulnerabilities (OSV-Scanner / OSV.dev)
        # Scans every committed lockfile against OSV.dev; fails on findings.
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            ghcr.io/google/osv-scanner:latest scan source --recursive /src
      - name: SAST (semgrep)
        # Run semgrep via its image (LGPL-2.1, free, no token for community rules).
        # The semgrep-action wrapper is deprecated and nudges toward Semgrep Cloud.
        # Gate on ERROR severity only (WARNING/INFO are advisory noise on a
        # skills+tooling monorepo). Three rules are excluded as false-positives
        # for this repo's nature:
        #   - detect-child-process: the hook scripts/installers spawn processes by
        #     design (CLI tooling, not request handlers).
        #   - detect-insecure-websocket: only matches a `ws://` example inside the
        #     security-review docs, not shipped code.
        #   - dockerfile missing-user: the static-site nginx image must run as root
        #     to bind :80 behind Traefik; non-root would change the port/deploy.
        # All 518 rules still run, so new high-severity issues (eval, hardcoded
        # secrets, injection) will fail the gate.
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep semgrep scan --config auto --severity ERROR --error \
            --exclude-rule javascript.lang.security.detect-child-process.detect-child-process \
            --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            /src

  # Merge-gate hygiene: Conventional PR title (mirrors the local commit advisory).
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, unn]
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
