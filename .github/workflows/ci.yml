# Arcwright workshop — CI gates (scaffolded by the ci-gates skill, trimmed to this repo).
# Monorepo: root build pipeline + website (Vite/React/TS) + npm packages.
#
# Runners: every job uses a fresh GitHub-hosted VM. Pull requests must not execute
# contributor-controlled code on shared self-hosted runners. Keep any future
# privileged self-hosted workflow separate and restricted to trusted branches.
# Third-party actions, scanner archives, and the SAST image are pinned below.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required by the pr-title semantic check (amannn/action-semantic-pull-request)
  # to read the pull request; without it the job 403s "Resource not accessible".
  pull-requests: read

# All deps are public npm. Force the public registry and ignore runner-local npm
# configuration so installs do not depend on or expose private registry credentials.
env:
  npm_config_registry: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /dev/null

jobs:
  # Build verification — runs the workshop packager (includes the no-leak check).
  build-package:
    name: build (package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node build/build.js

  # Unit tests + coverage gate (agent-orchestration package, Vitest 80/80/70).
  test-package:
    name: test (package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-orchestration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/agent-orchestration/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage

  # Website static gates: lint + type-check + production build.
  website:
    name: static (website)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Catches src/data/ drifting from the repo it describes (dead skill slugs,
      # unmapped agent icons). Not in `npm run build`: the Dockerfile builds with
      # website/ as its context, where ../.agents/skills does not exist.
      - run: npm run check:data
      - run: npm run check:copy
      - run: npm run build # tsc -b && vite build (type-check + bundle)
      - name: Docker production smoke check
        run: |
          set -euo pipefail
          grep -Fx 'RUN npm ci' Dockerfile
          image="arcwright-website:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            docker image rm "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --no-cache --tag "$image" .
          container_id="$(docker run --detach --publish 127.0.0.1::80 "$image")"
          port="$(docker port "$container_id" 80/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          test -n "$port"

          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" | grep -qx 'ok' \
              && curl --fail --silent "http://127.0.0.1:${port}/" | grep -Fq '<title>Arcwright:'; then
              echo "Docker production smoke check passed"
              exit 0
            fi
            sleep 1
          done

          echo "Docker production smoke check failed"
          docker logs "$container_id"
          exit 1

  # Security: secret scan, dependency/vuln, SAST — language-agnostic.
  # NOTE: scanners run as native binaries against $GITHUB_WORKSPACE instead of
  # relying on runner-local container mounts. This keeps the scan target explicit
  # on the fresh hosted VM.
  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        # gitleaks CLI (MIT, free). The gitleaks-action wrapper requires a paid
        # GITLEAKS_LICENSE on private repos; the binary does not. fetch-depth:0
        # gives it full history. .gitleaks.toml allowlists doc false-positives.
        run: |
          set -euo pipefail
          gitleaks_archive=/tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$gitleaks_archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $gitleaks_archive" \
            | sha256sum --check --status
          tar -xzf "$gitleaks_archive" -C /tmp gitleaks
          /tmp/gitleaks detect --source="$GITHUB_WORKSPACE" \
            --config="$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact --no-banner --exit-code=1 -v
      - name: Dependency + vuln scan (trivy)
        # trivy CLI (Apache-2.0). Run the binary natively against the workspace
        # instead of adding another container mount to the validation path.
        run: |
          set -euo pipefail
          trivy_archive=/tmp/trivy_0.71.2_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$trivy_archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz
          echo "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460  $trivy_archive" \
            | sha256sum --check --status
          tar -xzf "$trivy_archive" -C /tmp trivy
          /tmp/trivy fs --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress "$GITHUB_WORKSPACE"
      - name: Dependency vulnerabilities (OSV-Scanner / OSV.dev)
        # Scans every committed lockfile against OSV.dev; fails on findings.
        run: |
          set -euo pipefail
          osv_scanner=/tmp/osv-scanner
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$osv_scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $osv_scanner" \
            | sha256sum --check --status
          chmod +x "$osv_scanner"
          "$osv_scanner" scan source --recursive "$GITHUB_WORKSPACE"

  # SAST (semgrep) — HARD gate. The semgrep image ships `semgrep-core`, which
  # won't pip-install reliably. Checkout on the hosted VM, then copy the tree
  # into the container so the scanner sees exactly the checked-out workspace.
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: SAST (semgrep)
        # Gate on ERROR severity only (WARNING/INFO are noise on a skills+tooling
        # monorepo). Three rules are excluded as false-positives here:
        #   - detect-child-process: hook scripts/installers spawn processes by
        #     design (CLI tooling, not request handlers).
        #   - detect-insecure-websocket: only a `ws://` example in security docs.
        #   - dockerfile missing-user: the nginx static image binds :80 as root.
        # All rules still run, so new high-severity issues (eval, hardcoded
        # secrets, injection) fail the gate.
        run: |
          set -euo pipefail
          # Semgrep 1.168.0, pinned to the Linux/amd64 image manifest digest.
          CID=$(docker create semgrep/semgrep@sha256:525beaba156b9bd3f9847d6ec0eb8f308e11f407e0c0b2da641e7c8dd99c97d6 \
            semgrep scan --config auto --severity ERROR --error \
              --exclude-rule javascript.lang.security.detect-child-process.detect-child-process \
              --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
              --exclude-rule dockerfile.security.missing-user.missing-user \
              /src)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$GITHUB_WORKSPACE/." "$CID:/src"
          docker start -a "$CID"

  # Merge-gate hygiene: Conventional PR title (mirrors the local commit advisory).
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
