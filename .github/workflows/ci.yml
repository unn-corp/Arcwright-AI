# Arcwright workshop — CI gates.
# Monorepo: root build pipeline + website (Vite/React/TS) + npm packages.
#
# Security is the org baseline (unn-corp/.github security-baseline.yml): gitleaks,
# OSV-Scanner, Opengrep, zizmor and actionlint. On pull requests it reports only
# what the PR introduces; pushes, the weekly sweep and manual runs scan the whole
# repo and its history. Exceptions belong in .gitleaksignore / osv-scanner.toml /
# an inline `nosemgrep` with a reason, never in this workflow.
#
# Runners: the isolated self-hosted pool on the mothership VPS,
# [self-hosted, linux, x64, unn-isolated]. Each job gets a fresh ephemeral runner
# with its own DinD daemon, destroyed after the job. /tmp is mounted noexec there,
# so anything a job downloads and runs belongs under $RUNNER_TEMP.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  # Weekly sweep: catches newly disclosed advisories in unchanged dependencies.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All deps are public npm. Pin the public registry and ignore any user-level
# ~/.npmrc on the runner (it used to point at a private CodeArtifact mirror with a
# frequently-expired token, which 401s every install).
env:
  npm_config_registry: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /dev/null

jobs:
  security:
    uses: unn-corp/.github/.github/workflows/security-baseline.yml@0867b7467a28b27c8b22c2a36f79b1fa0435b38f # v2
    with:
      languages: javascript typescript python
      # detect-child-process: the hook scripts and installers spawn processes by
      # design (CLI tooling, not request handlers).
      # detect-insecure-websocket: its only hits are ws:// examples in skill docs.
      skip-rules: >-
        javascript/lang/security/detect-child-process.yaml
        javascript/lang/security/detect-insecure-websocket.yaml

  # Build verification — runs the workshop packager (includes the no-leak check).
  build-package:
    name: build (package)
    needs: security
    runs-on: [self-hosted, linux, x64, unn-isolated]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node build/build.js

  # Unit tests + coverage gate (agent-orchestration package, Vitest 80/80/70).
  test-package:
    name: test (package)
    needs: security
    runs-on: [self-hosted, linux, x64, unn-isolated]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/agent-orchestration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          # No npm cache: this package's package-lock.json is gitignored by repo
          # convention (.gitignore: packages/*/package-lock.json), so it isn't in
          # the CI checkout. Use `npm install` (not `npm ci`) for the same reason.
      - run: npm install --no-audit --no-fund
      - run: npm run test:coverage
        env:
          # Tests write stub executables under os.tmpdir() and run them; /tmp is
          # noexec on the isolated pool.
          TMPDIR: ${{ runner.temp }}

  # Website static gates: lint + type-check + production build.
  website:
    name: static (website)
    needs: security
    runs-on: [self-hosted, linux, x64, unn-isolated]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Catches src/data/ drifting from the repo it describes (dead skill slugs,
      # unmapped agent icons). Not in `npm run build`: the Dockerfile builds with
      # website/ as its context, where ../.agents/skills does not exist.
      - run: npm run check:data
      - run: npm run build # tsc -b && vite build (type-check + bundle)

  # Merge-gate hygiene: Conventional PR title (mirrors the local commit advisory).
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, unn-isolated]
    timeout-minutes: 5
    permissions:
      pull-requests: read # the action reads the pull request's title
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
