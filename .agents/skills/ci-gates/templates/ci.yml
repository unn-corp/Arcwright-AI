# Arcwright ci-gates — merge-gate workflow (scaffold).
#
# Fast-fail ordering: cheap gates first so a lint typo never waits on E2E.
# Delete the jobs you don't need; keep job NAMES stable so branch protection's
# "required status checks" keep matching. See the skill's references/branch-
# protection.md to turn these into hard merge gates.
#
# Runners: defaults to SELF-HOSTED Linux ([self-hosted, linux, x64]). Set the
# label set to match your org's runners (e.g. add a custom org label like `unn`
# to pin to your fleet, or swap to `ubuntu-latest` for GitHub-hosted). All jobs
# share the same `runs-on` below — change it once. A job that queues forever
# means no runner matches these labels / the runner group does not grant this
# repo access. See references/self-hosted-runners.md.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Private npm registry? If a runner's ~/.npmrc points at a private mirror (e.g.
# AWS CodeArtifact) whose token expires, every `npm ci`/`npm install` 401s even
# for public deps. Force the public registry and ignore that userconfig by
# uncommenting this job-level env (see references/tooling.md):
# env:
#   npm_config_registry: https://registry.npmjs.org/
#   NPM_CONFIG_USERCONFIG: /dev/null

jobs:
  # ── Gate 1+2+3: format, lint, type-check (Node/TS) ──────────────────────────
  static-node:
    name: static (node)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Monorepo: point at the actual lockfile, e.g. cache-dependency-path: website/package-lock.json
      - run: npm ci # needs a package-lock.json in working-directory (set working-directory for monorepos)
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npx tsc --noEmit

  # ── Gate 5: unit tests + coverage threshold (Vitest or Jest) ────────────────
  test-node:
    name: test (node)
    runs-on: [self-hosted, linux, x64]
    needs: static-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Vitest reads coverage.thresholds from vite/vitest config (80/80/70).
      # Jest equivalent: `npx jest --coverage` with coverageThreshold in config.
      - run: npx vitest run --coverage

  # ── Gates 1+2+3+5: Python (drop if not a Python repo) ───────────────────────
  python:
    name: static + test (python)
    runs-on: [self-hosted, linux, x64]
    if: ${{ hashFiles('pyproject.toml', 'requirements.txt') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -e . 2>/dev/null || pip install -r requirements.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: pytest --cov --cov-fail-under=80

  # ── Gate 4+7: security — secret scan, dependency vuln + SAST ────────────────
  # Scanners run as NATIVE release binaries, not via their GitHub Actions or
  # `docker run -v`. Why: (1) gitleaks-action needs a paid GITLEAKS_LICENSE on
  # PRIVATE repos; the CLI is free. (2) On self-hosted DinD runners (the default
  # target here) a `docker run -v "$GITHUB_WORKSPACE:/x"` mounts an EMPTY host
  # path — the workspace lives inside the runner container, not on the host
  # daemon — so the scanner sees nothing and fails or passes vacuously. Native
  # binaries against $GITHUB_WORKSPACE work on both self-hosted and GitHub-hosted
  # runners. See references/self-hosted-runners.md. Pinned versions — bump
  # periodically.
  security:
    name: security
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history for a deep scan
      - name: Secret scan (gitleaks)
        # Honors a repo-root .gitleaks.toml allowlist if present (for doc/example
        # false-positives). See references/tooling.md.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          CFG=""; [ -f .gitleaks.toml ] && CFG="--config=$GITHUB_WORKSPACE/.gitleaks.toml"
          /tmp/gitleaks detect --source="$GITHUB_WORKSPACE" $CFG \
            --redact --no-banner --exit-code=1 -v
      - name: Dependency + vuln scan (trivy)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz \
            | tar -xz -C /tmp trivy
          /tmp/trivy fs --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress "$GITHUB_WORKSPACE"
      - name: Dependency vulnerabilities (OSV-Scanner / OSV.dev)
        # Scans every committed lockfile (the dependency surface of the built
        # artifact) against the OSV.dev database. Non-zero exit on findings fails.
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner && chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --recursive "$GITHUB_WORKSPACE"

  # ── Gate 7: SAST (semgrep) — separate job, runs in the semgrep container ─────
  # semgrep ships its OCaml `semgrep-core` in its image but won't pip-install it
  # reliably on a bare runner; a `container:` job needs runner externals (node,
  # _temp mount) a self-hosted DinD runner may lack; and `docker run -v` hits the
  # empty-bind-mount trap above. So: checkout on the runner, then push the tree
  # INTO the container with `docker cp` (daemon API — no host/container path
  # mismatch) and `docker start -a` to run it and propagate the exit code.
  # `--severity ERROR` gates on high-confidence findings only; add
  # `--exclude-rule <id>` for any documented false-positives. On GitHub-hosted
  # runners you may instead use `uses: semgrep/semgrep-action@v1` with a token.
  sast:
    name: sast (semgrep)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: SAST (semgrep)
        run: |
          set -euo pipefail
          CID=$(docker create semgrep/semgrep:1.168.0 \
            semgrep scan --config auto --severity ERROR --error /src)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$GITHUB_WORKSPACE/." "$CID:/src"
          docker start -a "$CID"

  # ── Merge gate: PR-title convention (advisory locally, enforced here) ───────
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
